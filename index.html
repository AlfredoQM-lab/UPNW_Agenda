                            </span>
                        </div>
                        <div class="flex items-center justify-between gap-2 mt-1">
                            <span class="text-[11px] font-semibold text-slate-600 truncate">${rangeText} · ${cluster.events.length} actividades</span>
                            <div class="flex items-center gap-1 shrink-0">${areaDots}</div>
                        </div>
                    `;
                    slotsCol.appendChild(stackBlock);
                }
            });

            body.appendChild(axisCol);
            body.appendChild(slotsCol);
            card.appendChild(body);
            container.appendChild(card);

            const firstEventHour = dayEvents.length > 0 ? dayEvents[0].startDate.getHours() : 8;
            const targetHour = Math.max(0, Math.min(20, firstEventHour - 1));
            container.scrollTop = targetHour * HOUR_ROW_HEIGHT;
        }

        function openClusterModal(cluster) {
            lastOpenedCluster = cluster;
            const rangeText = `${formatMinsToAmPm(cluster.startMins)} - ${formatMinsToAmPm(cluster.endMins)}`;
            document.getElementById('clusterModalSubtitle').innerText = rangeText;
            document.getElementById('clusterModalTitle').innerText = `${cluster.events.length} eventos en este horario`;

            const listEl = document.getElementById('clusterModalList');
            listEl.innerHTML = '';

            cluster.events.forEach(ev => {
                const itemBtn = document.createElement('button');
                itemBtn.type = 'button';
                itemBtn.className = 'w-full text-left bg-wiener-lightBg/85 hover:bg-cyan-50 active:bg-cyan-100/70 border border-wiener-border rounded-2xl p-3 flex items-stretch gap-3 transition';
                itemBtn.onclick = () => {
                    closeClusterModal();
                    openEventModal(ev, true);
                };

                const timeText = `${formatAmPm(ev.startDate)}${ev.endDate ? ' - ' + formatAmPm(ev.endDate) : ''}`;
                itemBtn.innerHTML = `
                    <div class="w-1.5 rounded-full shrink-0" style="background-color: ${ev.palette.barColor};"></div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center justify-between gap-2 mb-0.5">
                            <span class="text-[10px] font-extrabold text-wiener-darkCyan truncate">${ev.area}</span>
                            <span class="text-[10px] font-bold text-slate-600 shrink-0">${timeText}</span>
                        </div>
                        <div class="text-xs font-extrabold text-slate-900 leading-snug">${ev.title}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5 truncate">${ev.modalidad} · ${ev.lugar}</div>
                    </div>
                `;
                listEl.appendChild(itemBtn);
            });

            const modal = document.getElementById('clusterModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeClusterModal() {
            const modal = document.getElementById('clusterModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function returnToClusterModal() {
            closeDetailModal();
            if (lastOpenedCluster) {
                openClusterModal(lastOpenedCluster);
            }
        }

        function renderCurrentView(scrollToSelected = false) {
            const agendaEl = document.getElementById('agendaScrollContainer');
            const dayEl = document.getElementById('dayTimelineContainer');

            if (viewMode === 'agenda') {
                dayEl.classList.add('hidden');
                agendaEl.classList.remove('hidden');
                renderAgendaList(scrollToSelected);
            } else {
                agendaEl.classList.add('hidden');
                dayEl.classList.remove('hidden');
                renderDayTimeline();
            }
        }

        function syncHeaderWithScroll() {
            if (viewMode !== 'agenda' || Date.now() < ignoreScrollUntil) return;

            const container = document.getElementById('agendaScrollContainer');
            const sections = [...container.querySelectorAll('[data-date-key]')];
            if (sections.length === 0) return;

            const containerRect = container.getBoundingClientRect();
            const thresholdTop = containerRect.top + 28;

            let activeSection = sections[0];
            for (const sec of sections) {
                const rect = sec.getBoundingClientRect();
                if (rect.top <= thresholdTop) {
                    activeSection = sec;
                } else {
                    break;
                }
            }

            const key = activeSection.dataset.dateKey;
            if (!key || key === toDateKey(selectedDate)) return;

            const nextDate = parseDateKey(key);
            const monthOrYearChanged =
                nextDate.getMonth() !== selectedDate.getMonth() ||
                nextDate.getFullYear() !== selectedDate.getFullYear();

            const prevSunday = startOfSundayWeek(weekAnchorDate);
            const nextSunday = startOfSundayWeek(nextDate);
            const weekChanged = toDateKey(prevSunday) !== toDateKey(nextSunday);

            selectedDate = nextDate;
            if (weekChanged) {
                weekAnchorDate = new Date(nextDate);
            }
            if (monthOrYearChanged) {
                renderHeaderMonth();
            } else {
                updateFloatingTodayArrow();
                updateWeekRangeBadge();
            }
            renderCalendarGrid();
        }

        function onAgendaScroll() {
            if (scrollSyncRaf) return;
            scrollSyncRaf = requestAnimationFrame(() => {
                scrollSyncRaf = null;
                syncHeaderWithScroll();
            });
        }

        function selectDate(newDate, shouldRenderView = true) {
            selectedDate = startOfDay(newDate);
            weekAnchorDate = new Date(selectedDate);
            renderHeaderMonth();
            renderCalendarGrid();
            if (shouldRenderView) {
                renderCurrentView(true);
            }
        }

        function goToToday() {
            selectDate(new Date(), true);
        }

        function setViewMode(mode) {
            viewMode = mode;
            const agendaBtn = document.getElementById('modeAgendaBtn');
            const dayBtn = document.getElementById('modeDayBtn');

            if (mode === 'agenda') {
                agendaBtn.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-wiener-cyan text-white shadow-xs transition active:scale-95';
                dayBtn.className = 'px-4 py-1.5 rounded-full text-xs font-semibold bg-white/80 text-slate-700 border border-wiener-border transition active:scale-95';
            } else {
                dayBtn.className = 'px-4 py-1.5 rounded-full text-xs font-bold bg-wiener-cyan text-white shadow-xs transition active:scale-95';
                agendaBtn.className = 'px-4 py-1.5 rounded-full text-xs font-semibold bg-white/80 text-slate-700 border border-wiener-border transition active:scale-95';
            }
            renderCurrentView(true);
        }

        function openEventModal(ev, fromCluster = false) {
            document.getElementById('detailAreaBadge').innerText = ev.area;
            document.getElementById('detailImpBadge').innerText = ev.importancia;
            document.getElementById('detailTitle').innerText = ev.title;
            document.getElementById('detailTime').innerText = `${formatAmPm(ev.startDate)}${ev.endDate ? ' - ' + formatAmPm(ev.endDate) : ''}`;
            document.getElementById('detailModality').innerText = ev.modalidad;
            document.getElementById('detailPlace').innerText = ev.lugar;
            document.getElementById('detailAudience').innerText = ev.publico;

            const commentEl = document.getElementById('detailComment');
            if (ev.comentario) {
                commentEl.innerText = ev.comentario;
                commentEl.classList.remove('hidden');
            } else {
                commentEl.classList.add('hidden');
            }

            const backBtn = document.getElementById('detailBackToClusterBtn');
            if (fromCluster && lastOpenedCluster) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }

            const modal = document.getElementById('detailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initHeaderLogo();
            initCalendarHandleGestures();
            initLiveCalendarDrag();

            attachHorizontalSwipe(
                document.getElementById('dayTimelineContainer'),
                () => {
                    selectDate(addDays(selectedDate, 1), true);
                    playSlideFeedback(document.getElementById('dayTimelineContainer'), 'left');
                },
                () => {
                    selectDate(addDays(selectedDate, -1), true);
                    playSlideFeedback(document.getElementById('dayTimelineContainer'), 'right');
                }
            );

            selectDate(new Date(), false);
            updateFilterChipsUI();
            document.getElementById('agendaScrollContainer').addEventListener('scroll', onAgendaScroll, { passive: true });
            try {
                const res = await fetch(`${JSON_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                allEvents = normalizeEvents(data);
            } catch (err) {
                allEvents = normalizeEvents(fallbackEvents);
            }
            renderCalendarGrid();
            renderCurrentView(true);
            document.getElementById('appLoader').classList.add('hidden');
        });
    </script>
</body>
</html>
    </template>

    <script>
        (function () {
            const MOBILE_BREAKPOINT = 768; // Ajusta a 1024 si quieres incluir tablets en vista móvil
            let currentMode = null;

            function isMobileDevice() {
                return window.innerWidth <= MOBILE_BREAKPOINT;
            }

            function renderActiveView() {
                const targetMode = isMobileDevice() ? 'mobile' : 'desktop';
                if (targetMode === currentMode) return;

                currentMode = targetMode;
                const templateId = targetMode === 'mobile' ? 'tpl-mobile' : 'tpl-desktop';
                const tpl = document.getElementById(templateId);
                const frame = document.getElementById('appFrame');

                if (tpl && frame) {
                    frame.srcdoc = tpl.innerHTML;
                }
            }

            // Carga inicial
            renderActiveView();

            // Re-evalúa si se redimensiona la ventana o se gira el teléfono
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(renderActiveView, 250);
            });
        })();
    </script>
</body>
</html>
