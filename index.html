 <!DOCTYPE html>
<html lang="es" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Institucional - Universidad Norbert Wiener</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wiener: {
                            cyan: '#00A3AD',
                            darkCyan: '#00838B',
                            lightBg: '#F4FAFC',
                            cardBg: '#FFFFFF',
                            border: '#CBE9F0',
                            text: '#1E293B',
                            muted: '#64748B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FullCalendar CSS & JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 163, 173, 0.4) transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 163, 173, 0.35);
            border-radius: 9999px;
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 163, 173, 0.65);
        }

        /* Degradado ambiental modo claro */
        .app-gradient-bg {
            background:
                radial-gradient(circle at 0% 100%, rgba(168, 232, 249, 0.55) 0%, transparent 38%),
                radial-gradient(circle at 100% 100%, rgba(186, 240, 180, 0.55) 0%, transparent 42%),
                linear-gradient(180deg, #F5FBFE 0%, #EEF8FC 55%, #EAF7EC 100%);
        }

        .fc .fc-button-primary {
            background-color: #00A3AD !important;
            border-color: #00A3AD !important;
            color: #ffffff !important;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s ease;
        }
        .fc .fc-button-primary:hover {
            background-color: #00838B !important;
            border-color: #00838B !important;
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background-color: #006D74 !important;
            border-color: #006D74 !important;
        }

        .fc-col-header-cell-cushion {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-transform: uppercase;
            font-size: 0.85rem !important;
            padding: 8px 0 !important;
            gap: 2px;
        }

        .fc .fc-day-today {
            background-color: rgba(0, 163, 173, 0.06) !important;
        }

        /* Bloques de eventos: siempre coloreados, nunca blancos, sin desbordes */
        .fc-timegrid-event,
        .fc-daygrid-event {
            margin: 2px !important;
            border-radius: 6px !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
            border-width: 1px !important;
            cursor: pointer;
            overflow: hidden !important;
            max-width: 100% !important;
        }

        .fc-timegrid-event {
            padding: 3px 5px !important;
        }

        .fc-daygrid-event {
            padding: 2px 5px !important;
        }

        /* Limita estrictamente el contenido dentro del bloque en vistas compactas */
        .fc-daygrid-event .fc-event-main,
        .fc-daygrid-event .fc-event-main-frame {
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            max-width: 100% !important;
        }

        .fc-timegrid-event .fc-event-main,
        .fc-timegrid-event .fc-event-main-frame {
            overflow: hidden !important;
            max-width: 100% !important;
            max-height: 100% !important;
        }

        .fc, .fc-theme-standard td, .fc-theme-standard th, .fc-theme-standard .fc-scrollgrid {
            border-color: #C9E8F2 !important;
        }
        .fc-col-header-cell {
            background: linear-gradient(180deg, #0077C8 0%, #00559E 100%) !important;
            border-color: #1D82CC !important;
        }
        .fc-col-header-cell-cushion {
            color: #FFFFFF !important;
            font-weight: 700 !important;
        }
        .fc-timegrid-axis, .fc-timegrid-slot-label {
            color: #1E3A5F !important;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .fc-daygrid-day, .fc-timegrid-slot {
            transition: background-color 0.15s ease;
            cursor: pointer;
        }
        .fc-daygrid-day:hover, .fc-timegrid-slot:hover {
            background-color: rgba(0, 163, 173, 0.06) !important;
        }

        /* Fondo celeste tenue intercalado por columna en vista Semana */
        .fc-timeGridWeek-view .fc-timegrid-cols table tbody tr td.fc-timegrid-col:nth-child(even) {
            background-color: rgba(0, 163, 173, 0.045) !important;
        }

        /* Mantiene el hover suave sin perder el tono intercalado */
        .fc-timeGridWeek-view .fc-timegrid-col:nth-child(even):hover {
            background-color: rgba(0, 163, 173, 0.085) !important;
        }

        #customTooltip {
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .active-top-btn {
            background-color: rgba(0, 163, 173, 0.15) !important;
            box-shadow: 0 0 10px rgba(0, 163, 173, 0.25), inset 0 0 4px rgba(0, 163, 173, 0.2) !important;
            border-color: rgba(0, 163, 173, 0.45) !important;
        }

        /* Animación suave para el loader */
        @keyframes pulseRing {
            0% { transform: scale(0.92); opacity: 0.65; }
            50% { transform: scale(1.06); opacity: 0.25; }
            100% { transform: scale(0.92); opacity: 0.65; }
        }
        .loader-ring-pulse {
            animation: pulseRing 1.6s ease-in-out infinite;
        }
    </style>
</head>

        <main class="flex-1 p-4 overflow-y-auto transition-colors duration-200 relative min-w-0">
            <!-- PANTALLA DE ESPERA AMIGABLE (LOADER) -->
            <div id="calendarLoader" class="absolute inset-4 z-20 rounded-2xl bg-white/80 backdrop-blur-md border-2 border-wiener-border flex flex-col items-center justify-center transition-opacity duration-200">
                <div class="relative flex items-center justify-center mb-3">
                    <div class="w-16 h-16 rounded-full bg-cyan-100/80 loader-ring-pulse absolute"></div>

                    <svg class="w-5 h-5 text-wiener-cyan absolute" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <p id="calendarLoaderTitle" class="text-sm font-bold text-slate-800 tracking-tight">Cargando agenda...</p>

            <div id='calendar' class="h-full bg-white/95 border-2 border-wiener-border rounded-2xl p-3 shadow-md transition-colors duration-200"></div>

    <!-- TOOLTIP Y MODALES -->
    <div id="customTooltip" class="fixed z-50 bg-gray-900/95 backdrop-blur-md text-white text-xs rounded-lg p-3 shadow-xl border border-gray-700 max-w-xs opacity-0 pointer-events-none transform scale-95 transition-all">

    <div id="multiModal" class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center hidden transition-all">
        <div class="bg-white border border-wiener-border rounded-xl w-full max-w-md p-6 shadow-2xl text-wiener-text">
            <div class="flex items-center justify-between border-b border-wiener-border pb-3 mb-4"><h3 id="multiModalTitle" class="text-base font-bold text-gray-800">📅 Eventos del Día</h3><button onclick="closeMultiModal()" class="text-gray-400 hover:text-gray-700 text-xl font-bold">&times;</button></div>
            <p class="text-xs text-wiener-muted mb-4">Selecciona el evento que deseas consultar:</p>

    <div id="emptyModal" class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center hidden transition-all">
        <div class="bg-white border border-wiener-border rounded-xl w-full max-w-sm p-6 shadow-2xl text-center text-wiener-text">
            <div class="w-12 h-12 bg-cyan-50 text-wiener-cyan rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl border border-cyan-100">📅</div>
            <h3 class="text-lg font-bold text-gray-800 mb-1">Sin Actividades</h3>
            <p id="emptyModalText" class="text-xs text-wiener-muted mb-5">No se encuentran eventos programados para esta fecha.</p>
            <button onclick="closeEmptyModal()" class="bg-wiener-cyan hover:bg-wiener-darkCyan text-white text-sm font-semibold px-5 py-2 rounded-lg shadow-sm w-full">Entendido</button>
        </div>
    </div>

    <script>
        const JSON_URL = './eventos.json';

        // Tonos base por ÁREA (un solo color fijo por cada área encontrada)
        const AREA_HUE_BASES = [
            188, // Cian / Celeste institucional
            142, // Verde esmeralda / menta
            210, // Azul
            272, // Morado / lila
            28,  // Naranja / ámbar
            342, // Rosa / coral
            48,  // Amarillo dorado
            168  // Turquesa
        ];

        const fallbackEvents = [
            { id: "5", title: "CAPACITACIÓN A DOCENTES Y TUTORES", area: "JEFATURA DE BIENESTAR", start: "2027-01-01T10:00:00", end: "2027-01-01T12:00:00", lugar: "SEDE 1 - LIMA CENTRO", modalidad: "PRESENCIAL", publico: "PERSONAL ASISTENCIAL", comentario: "", importancia: "MUY ALTA" },
            { id: "6", title: "CHARLA VIRTUAL DE SALUD MENTAL", area: "JEFATURA DE BIENESTAR", start: "2027-01-01T10:00:00", end: "2027-01-01T11:00:00", lugar: "SEDE 1 - LIMA CENTRO", modalidad: "VIRTUAL - TEAMS", publico: "ESTUDIANTES", comentario: "", importancia: "ALTA" },
            { id: "7", title: "CHARLA VIRTUAL DE SALUD MENTAL", area: "JEFATURA DE BIENESTAR", start: "2027-03-24T17:00:00", end: "2027-03-24T18:00:00", lugar: "SEDE 2 - LIMA CENTRO", modalidad: "VIRTUAL - TEAMS", publico: "TODA LA COMUNIDAD", comentario: "", importancia: "ALTA" },
            { id: "16", title: "Taller Psicoeducativo de Adaptación", area: "JEFATURA DE BIENESTAR", start: "2027-01-15T15:00:00", end: "2027-01-15T16:00:00", lugar: "SEDE 1 - LIMA CENTRO", modalidad: "PRESENCIAL", publico: "ESTUDIANTES", comentario: "", importancia: "BAJA" },
            { id: "17", title: "1° Taller Liderazgo Estudiantil", area: "JEFATURA DE BIENESTAR", start: "2027-03-30T12:00:00", end: "2027-03-30T13:00:00", lugar: "SEDE 1 - LIMA CENTRO", modalidad: "VIRTUAL - TEAMS", publico: "ESTUDIANTES", comentario: "", importancia: "MEDIA" }
        ];

        let allEvents = [];
        let calendar;
        let currentLugarFilter = '';
        let currentAreaFilter = '';
        let currentImportanceFilter = '';
        let miniCalendarDate = new Date();
        let miniClickMode = 'week';
        let currentActiveSection = null;
        let areaColorMap = new Map();
        let loaderHideTimer = null;

        // Control de pantalla de espera amigable
        function showCalendarLoader(message = 'Cargando agenda...') {
            if (loaderHideTimer) {
                clearTimeout(loaderHideTimer);
                loaderHideTimer = null;
            }
            const loader = document.getElementById('calendarLoader');
            const titleEl = document.getElementById('calendarLoaderTitle');
            if (titleEl) titleEl.innerText = message;
            if (loader) {
                loader.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                loader.classList.add('opacity-100');
            }
        }

        function hideCalendarLoader(delayMs = 140) {
            if (loaderHideTimer) clearTimeout(loaderHideTimer);
            loaderHideTimer = setTimeout(() => {
                const loader = document.getElementById('calendarLoader');
                if (loader) {
                    loader.classList.remove('opacity-100');
                    loader.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        if (loader.classList.contains('opacity-0')) {
                            loader.classList.add('hidden');
                        }
                    }, 200);
                }
            }, delayMs);
        }

        // Muestra el loader antes de que el hilo principal renderice FullCalendar
        function runWithLoader(actionFn, message = 'Actualizando vista...') {
            showCalendarLoader(message);
            requestAnimationFrame(() => {
                setTimeout(() => {
                    try {
                        actionFn();
                    } finally {
                        hideCalendarLoader(160);
                    }
                }, 25);
            });
        }

        function buildAreaColorMap(events) {
            areaColorMap.clear();
            const uniqueAreas = [...new Set(events.map(ev => String(ev.area ?? 'SIN ÁREA').trim() || 'SIN ÁREA'))]
                .sort((a, b) => a.localeCompare(b, 'es'));

            uniqueAreas.forEach((areaName, i) => {
                const baseIdx = i % AREA_HUE_BASES.length;
                const cycleShift = Math.floor(i / AREA_HUE_BASES.length) * 19;
                const hue = (AREA_HUE_BASES[baseIdx] + cycleShift) % 360;
                areaColorMap.set(areaName, hue);
            });
        }

        function getEventColorPalette(areaName) {
            const cleanArea = String(areaName ?? 'SIN ÁREA').trim() || 'SIN ÁREA';
            const hue = areaColorMap.has(cleanArea) ? areaColorMap.get(cleanArea) : 188;

            const saturation = 68;
            const lightness = 74;
            const borderLightness = 50;

            return {
                backgroundColor: `hsl(${hue}, ${saturation}%, ${lightness}%)`,
                borderColor: `hsl(${hue}, ${Math.min(85, saturation + 6)}%, ${borderLightness}%)`,
                textColor: '#0F293A'
            };
        }

        function formatLocalDate(dateObj) {
            if (!dateObj) return '';
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getEventsForDateStr(dateStr) {
            return calendar.getEvents().filter(ev => {
                if (!ev.start) return false;
                const startStr = formatLocalDate(ev.start);
                if (!ev.end) return startStr === dateStr;
                const adjEnd = new Date(ev.end.getTime() - 1);
                const adjEndStr = formatLocalDate(adjEnd);
                const endStr = formatLocalDate(ev.end);
                return dateStr >= startStr && dateStr <= (adjEndStr || endStr);
            });
        }

        // Verifica si un evento se cruza en horario con algún otro evento del mismo día
        function hasTimeOverlapInDay(targetEvent) {
            if (!targetEvent || !targetEvent.start) return true;
            if (targetEvent.allDay) return true;

            const dStr = formatLocalDate(targetEvent.start);
            const dayEvents = getEventsForDateStr(dStr).filter(ev => !ev.allDay && ev.start);
            if (dayEvents.length <= 1) return false;

            const tStart = targetEvent.start.getTime();
            const tEnd = targetEvent.end ? targetEvent.end.getTime() : (tStart + 30 * 60000);

            return dayEvents.some(other => {
                if (other === targetEvent || other._def?.publicId === targetEvent._def?.publicId && other.start?.getTime() === tStart) {
                    if (other.title === targetEvent.title && other.start?.getTime() === tStart && (other.end?.getTime() || tEnd) === tEnd) {
                        return false;
                    }
                }
                const oStart = other.start.getTime();
                const oEnd = other.end ? other.end.getTime() : (oStart + 30 * 60000);
                return tStart < oEnd && tEnd > oStart;
            });
        }

        function handleDateOrEventSelection(dateStr, preferredEvent = null) {
            const eventosEnDia = getEventsForDateStr(dateStr);

            if (eventosEnDia.length === 0) {
                document.getElementById('emptyModalText').innerText = `No se encuentran eventos programados para el ${dateStr}.`;
                document.getElementById('emptyModal').classList.remove('hidden');
            } else if (eventosEnDia.length > 1) {
                mostrarSelectorEventos(dateStr, eventosEnDia);
            } else {
                mostrarDetalleEvento(preferredEvent || eventosEnDia[0]);
            }
        }

        function normalizeEvents(data) {
            const list = Array.isArray(data) ? data : (Array.isArray(data?.eventos) ? data.eventos : []);
            buildAreaColorMap(list);

            return list.map((ev, idx) => {
                const areaClean = String(ev.area ?? 'SIN ÁREA').trim() || 'SIN ÁREA';
                const impClean = String(ev.importancia ?? 'MEDIA').trim() || 'MEDIA';
                const palette = getEventColorPalette(areaClean);

                return {
                    ...ev,
                    id: String(ev.id ?? idx + 1),
                    title: String(ev.title ?? 'Evento sin título').trim(),
                    area: areaClean,
                    lugar: String(ev.lugar ?? '').trim(),
                    modalidad: String(ev.modalidad ?? 'PRESENCIAL').trim(),
                    publico: String(ev.publico ?? 'GENERAL').trim(),
                    comentario: String(ev.comentario ?? '').trim(),
                    importancia: impClean,
                    backgroundColor: palette.backgroundColor,
                    borderColor: palette.borderColor,
                    textColor: palette.textColor
                };
            });
        }

        function populateDynamicFilters(events) {
            // 1. LUGAR
            const lugares = [...new Set(events.map(ev => ev.lugar).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
            const desktopLugarList = document.getElementById('desktopLugarList');
            const mobileLugarList = document.getElementById('mobileLugarList');

            desktopLugarList.innerHTML = `<button onclick="selectLugar('')" class="w-full text-left px-3 py-2 text-xs rounded-lg ${currentLugarFilter === '' ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between lugar-item" data-value=""><span>Todos los Lugares</span></button>`;
            mobileLugarList.innerHTML = `<button onclick="selectLugar('')" class="w-full text-left px-2.5 py-1.5 text-xs rounded ${currentLugarFilter === '' ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between lugar-item-m" data-value=""><span>Todos los Lugares</span></button>`;

            lugares.forEach(lugar => {
                const esc = lugar.replace(/'/g, "\\'");
                desktopLugarList.insertAdjacentHTML('beforeend',
                    `<button onclick="selectLugar('${esc}')" class="w-full text-left px-3 py-2 text-xs rounded-lg ${currentLugarFilter === lugar ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between lugar-item" data-value="${lugar}"><span class="truncate">${lugar}</span></button>`
                );
                mobileLugarList.insertAdjacentHTML('beforeend',
                    `<button onclick="selectLugar('${esc}')" class="w-full text-left px-2.5 py-1.5 text-xs rounded ${currentLugarFilter === lugar ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between lugar-item-m" data-value="${lugar}"><span class="truncate">${lugar}</span></button>`
                );
            });

            // 2. ÁREA
            const areas = [...new Set(events.map(ev => ev.area).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
            const desktopAreaList = document.getElementById('desktopAreaList');
            const mobileAreaList = document.getElementById('mobileAreaList');

            desktopAreaList.innerHTML = `<button onclick="selectArea('')" class="w-full text-left px-3 py-2 text-xs rounded-lg ${currentAreaFilter === '' ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between area-item" data-value=""><span>Todas las Áreas</span></button>`;
            mobileAreaList.innerHTML = `<button onclick="selectArea('')" class="w-full text-left px-2.5 py-1.5 text-xs rounded ${currentAreaFilter === '' ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between area-item-m" data-value=""><span>Todas las Áreas</span></button>`;

            areas.forEach(area => {
                const esc = area.replace(/'/g, "\\'");
                const palette = getEventColorPalette(area);
                const dotHtml = `<span class="w-2.5 h-2.5 rounded-full shrink-0 ml-2 border" style="background-color: ${palette.backgroundColor}; border-color: ${palette.borderColor};"></span>`;

                desktopAreaList.insertAdjacentHTML('beforeend',
                    `<button onclick="selectArea('${esc}')" class="w-full text-left px-3 py-2 text-xs rounded-lg ${currentAreaFilter === area ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between area-item" data-value="${area}"><span class="truncate">${area}</span>${dotHtml}</button>`
                );
                mobileAreaList.insertAdjacentHTML('beforeend',
                    `<button onclick="selectArea('${esc}')" class="w-full text-left px-2.5 py-1.5 text-xs rounded ${currentAreaFilter === area ? 'bg-wiener-cyan text-white font-semibold' : 'hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600'} transition-colors flex items-center justify-between area-item-m" data-value="${area}"><span class="truncate">${area}</span>${dotHtml}</button>`
                );
            });

            // 3. IMPORTANCIA
            const orderMap = { 'MUY ALTA': 1, 'ALTA': 2, 'MEDIA': 3, 'BAJA': 4, 'MUY BAJA': 5 };
            const importances = [...new Set(events.map(ev => ev.importancia).filter(Boolean))].sort((a, b) => {
                const oa = orderMap[a.toUpperCase()] ?? 99;
                const ob = orderMap[b.toUpperCase()] ?? 99;
                return oa !== ob ? oa - ob : a.localeCompare(b, 'es');
            });

            const desktopImp = document.getElementById('desktopImportanceChips');
            const mobileImp = document.getElementById('mobileImportanceChips');

            desktopImp.innerHTML = `<button onclick="filterByImportance('')" class="imp-chip px-2.5 py-1 text-xs font-semibold rounded ${currentImportanceFilter === '' ? 'bg-wiener-cyan text-white shadow-sm' : 'font-medium text-gray-600 hover:text-wiener-cyan'} transition-all" data-imp="">Todas</button>`;
            mobileImp.innerHTML = `<button onclick="filterByImportance('')" class="imp-chip-m px-2 py-1 text-[11px] font-semibold rounded ${currentImportanceFilter === '' ? 'bg-wiener-cyan text-white shadow-sm' : 'font-medium text-gray-600 hover:text-wiener-cyan'} transition-all" data-imp="">Todas</button>`;

            importances.forEach(imp => {
                const esc = imp.replace(/'/g, "\\'");
                const label = imp.charAt(0).toUpperCase() + imp.slice(1).toLowerCase();
                desktopImp.insertAdjacentHTML('beforeend',
                    `<button onclick="filterByImportance('${esc}')" class="imp-chip px-2.5 py-1 text-xs rounded ${currentImportanceFilter === imp ? 'font-semibold bg-wiener-cyan text-white shadow-sm' : 'font-medium text-gray-600 hover:text-wiener-cyan'} transition-all" data-imp="${imp}">${label}</button>`
                );
                mobileImp.insertAdjacentHTML('beforeend',
                    `<button onclick="filterByImportance('${esc}')" class="imp-chip-m px-2 py-1 text-[11px] rounded ${currentImportanceFilter === imp ? 'font-semibold bg-wiener-cyan text-white shadow-sm' : 'font-medium text-gray-600 hover:text-wiener-cyan'} transition-all" data-imp="${imp}">${label}</button>`
                );
            });
        }

        async function loadEventsFromJson() {
            showCalendarLoader('Cargando eventos...');
            try {
                const res = await fetch(`${JSON_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const jsonData = await res.json();
                allEvents = normalizeEvents(jsonData);
            } catch (err) {
                console.warn('No se pudo cargar eventos.json externo, usando eventos de respaldo:', err);
                allEvents = normalizeEvents(fallbackEvents);
            }

            populateDynamicFilters(allEvents);
            if (calendar) {
                miniCalendarDate = new Date(calendar.getDate());
                filtrarEventos(false);
            }
            hideCalendarLoader(220);
        }

        document.addEventListener('DOMContentLoaded', async function() {
            showCalendarLoader('Inicializando calendario...');
            var calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                initialDate: new Date(),
                firstDay: 0,
                locale: 'es',
                locales: [
                    {
                        code: 'es',
                        week: { dow: 0, doy: 1 }
                    }
                ],
                slotDuration: '00:30:00',
                slotEventOverlap: false,
                slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
                dayHeaderContent: function(arg) {
                    const days = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
                    const dayIdx = typeof arg.dow === 'number' ? arg.dow : arg.date.getUTCDay();
                    const dayName = days[dayIdx];

                    if (calendar.view.type === 'dayGridMonth') {
                        return { html: `<span style="font-weight:700;">${dayName}</span>` };
                    }

                    const dayNum = arg.date.getUTCDate();
                    const monthNum = arg.date.getUTCMonth() + 1;
                    return { html: `<span style="font-weight:700;">${dayName}</span><span style="font-weight:600; font-size:0.78rem; opacity:0.95;">${dayNum}/${monthNum}</span>` };
                },
                eventDidMount: function(info) {
                    const bg = info.event.backgroundColor;
                    const bd = info.event.borderColor;
                    const fg = info.event.textColor || '#0F293A';
                    if (bg) info.el.style.setProperty('background-color', bg, 'important');
                    if (bd) info.el.style.setProperty('border-color', bd, 'important');
                    info.el.style.setProperty('color', fg, 'important');
                },
                eventContent: function(arg) {
                    const viewType = calendar.view.type;
                    const startStr = arg.event.start ? arg.event.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
                    const endStr = arg.event.end ? arg.event.end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
                    const timeRange = (startStr && endStr) ? `${startStr} - ${endStr}` : startStr;

                    if (viewType === 'timeGridDay') {
                        return {
                            html: `
                                <div class="font-bold text-[10px] opacity-85 mb-0.5 truncate">${timeRange}</div>
                                <div class="font-bold text-[11px] leading-tight break-words">${arg.event.title}</div>
                            `
                        };
                    }

                    if (viewType === 'timeGridWeek') {
                        if (arg.event.allDay || hasTimeOverlapInDay(arg.event)) {
                            return { html: '' };
                        }
                        return {
                            html: `
                                <div class="font-bold text-[10px] opacity-85 truncate">${timeRange}</div>
                                <div class="font-bold text-[10px] leading-tight truncate">${arg.event.title}</div>
                            `
                        };
                    }

                    return {
                        html: `<span class="block text-[10px] font-semibold truncate leading-tight">${arg.event.title}</span>`
                    };
                },
                headerToolbar: false,
                events: [],
                datesSet: function(info) {
                    document.getElementById('calendarTitle').innerText = info.view.title;
                    document.getElementById('calendarTitlePopup').innerText = info.view.title;
                    setTimeout(setupDayTooltips, 100);
                },
                dateClick: function(info) {
                    const clickedDateStr = info.dateStr.split('T')[0];
                    handleDateOrEventSelection(clickedDateStr);
                },
                eventClick: function(info) {
                    info.jsEvent.stopPropagation();
                    mostrarDetalleEvento(info.event);
                }
            });

            calendar.render();
            renderMiniCalendar();
            window.addEventListener('resize', handleResponsiveLayout);
            handleResponsiveLayout();

            await loadEventsFromJson();
        });

        function handleResponsiveLayout() {
            const sidebar = document.getElementById('sidebarPanel');
            const sidebarHeader = document.getElementById('sidebarHeader');
            const overlay = document.getElementById('sidebarOverlay');
            const desktopFilters = document.getElementById('desktopFiltersContainer');
            const desktopDateNav = document.getElementById('desktopDateNav');
            const mobileDateNavBtn = document.getElementById('mobileDateNavBtn');
            const mobileFilterBtn = document.getElementById('mobileFilterBtn');

            if (window.innerWidth < 1450) {
                desktopFilters.classList.add('hidden');
                mobileFilterBtn.classList.remove('hidden', 'flex');
                mobileFilterBtn.classList.add('flex');

                desktopDateNav.classList.add('hidden');
                mobileDateNavBtn.classList.remove('hidden', 'flex');
                mobileDateNavBtn.classList.add('flex');

                sidebar.classList.add('absolute', '-translate-x-full');
                sidebar.classList.remove('relative');
                sidebarHeader.classList.remove('hidden');
                overlay.classList.add('hidden');
                currentActiveSection = null;
                updateActiveTopButtons();
            } else {
                desktopFilters.classList.remove('hidden');
                mobileFilterBtn.classList.remove('flex');
                mobileFilterBtn.classList.add('hidden');

                desktopDateNav.classList.remove('hidden');
                mobileDateNavBtn.classList.remove('flex');
                mobileDateNavBtn.classList.add('hidden');

                sidebar.classList.remove('absolute', '-translate-x-full');
                sidebar.classList.add('relative');
                sidebarHeader.classList.add('hidden');
                overlay.classList.add('hidden');

                document.querySelectorAll('.sidebar-section').forEach(sec => sec.classList.add('hidden'));
                document.getElementById('sectionCalendar').classList.remove('hidden');
                updateActiveTopButtons();
            }

            setTimeout(() => { if(calendar) calendar.updateSize(); }, 300);
        }

        function updateActiveTopButtons() {
            const btnCal = document.getElementById('btnCalendar');
            const btnDate = document.getElementById('mobileDateNavBtn');
            const btnFilters = document.getElementById('mobileFilterBtn');

            [btnCal, btnDate, btnFilters].forEach(b => {
                if(b) b.classList.remove('active-top-btn');
            });

            if (window.innerWidth < 1450) {
                if (currentActiveSection === 'calendar' && btnCal) btnCal.classList.add('active-top-btn');
                if (currentActiveSection === 'date' && btnDate) btnDate.classList.add('active-top-btn');
                if (currentActiveSection === 'filters' && btnFilters) btnFilters.classList.add('active-top-btn');
            }
        }

        function toggleSidebarSection(sectionName) {
            if (window.innerWidth >= 1450) return;

            const sidebar = document.getElementById('sidebarPanel');
            const overlay = document.getElementById('sidebarOverlay');
            const titleEl = document.getElementById('sidebarPanelTitle');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (!isClosed && currentActiveSection === sectionName) {
                closeSidebarPanel();
                return;
            }

            document.querySelectorAll('.sidebar-section').forEach(sec => sec.classList.add('hidden'));

            if (sectionName === 'calendar') {
                document.getElementById('sectionCalendar').classList.remove('hidden');
                titleEl.innerText = 'CALENDARIO Y VISTA';
            } else if (sectionName === 'date') {
                document.getElementById('sectionDate').classList.remove('hidden');
                titleEl.innerText = 'NAVEGACIÓN DE FECHA';
                updateMobileDateText();
            } else if (sectionName === 'filters') {
                document.getElementById('sectionFilters').classList.remove('hidden');
                titleEl.innerText = 'FILTROS ACTIVOS';
            }

            currentActiveSection = sectionName;
            updateActiveTopButtons();
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');

            setTimeout(() => { if(calendar) calendar.updateSize(); }, 300);
        }

        function closeSidebarPanel() {
            if (window.innerWidth < 1450) {
                const sidebar = document.getElementById('sidebarPanel');
                const overlay = document.getElementById('sidebarOverlay');

                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                currentActiveSection = null;
                updateActiveTopButtons();

                setTimeout(() => { if(calendar) calendar.updateSize(); }, 300);
            }
        }

        function toggleDesktopLugarPopup(e) {
            if(e) e.stopPropagation();
            closeDesktopAreaPopup();
            const popup = document.getElementById('desktopLugarPopup');
            popup.classList.toggle('hidden');

                document.getElementById('lugarSearchInput').focus();

        function toggleDesktopAreaPopup(e) {

            closeDesktopLugarPopup();

                document.getElementById('areaSearchInput').focus();

        }

        function closeDesktopAreaPopup() {
            document.getElementById('desktopAreaPopup').classList.add('hidden');
        }

        function filterFilterList(inputId, containerId, itemSelector) {
            const query = document.getElementById(inputId).value.toLowerCase();
            const container = document.getElementById(containerId);
            const items = container.querySelectorAll(itemSelector);
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';

        function selectLugar(lugarVal) {
            currentLugarFilter = lugarVal;
            const labelText = lugarVal === '' ? 'Todos los Lugares' : lugarVal;
            if (document.getElementById('desktopLugarLabel')) {
                document.getElementById('desktopLugarLabel').innerText = labelText;
            }

            document.querySelectorAll('.lugar-item, .lugar-item-m').forEach(btn => {

                        'w-full text-left px-2.5 py-1.5 text-xs rounded bg-wiener-cyan text-white font-semibold transition-colors flex items-center justify-between lugar-item-m' :
                        'w-full text-left px-3 py-2 text-xs rounded-lg bg-wiener-cyan text-white font-semibold transition-colors flex items-center justify-between lugar-item';
                } else {
                    btn.className = btn.className.includes('lugar-item-m') ?
                        'w-full text-left px-2.5 py-1.5 text-xs rounded hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600 transition-colors flex items-center justify-between lugar-item-m' :
                        'w-full text-left px-3 py-2 text-xs rounded-lg hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600 transition-colors flex items-center justify-between lugar-item';
                }
            });

            closeDesktopLugarPopup();
            filtrarEventos(true);
        }

        function selectArea(areaVal) {
            currentAreaFilter = areaVal;
            const labelText = areaVal === '' ? 'Todas las Áreas' : areaVal;
            if(document.getElementById('desktopAreaLabel')) {
                document.getElementById('desktopAreaLabel').innerText = labelText;
            }

            document.querySelectorAll('.area-item, .area-item-m').forEach(btn => {
                if (btn.getAttribute('data-value') === areaVal) {
                    btn.className = btn.className.includes('area-item-m') ?
                        'w-full text-left px-2.5 py-1.5 text-xs rounded bg-wiener-cyan text-white font-semibold transition-colors flex items-center justify-between area-item-m' :
                        'w-full text-left px-3 py-2 text-xs rounded-lg bg-wiener-cyan text-white font-semibold transition-colors flex items-center justify-between area-item';
                } else {
                    btn.className = btn.className.includes('area-item-m') ?
                        'w-full text-left px-2.5 py-1.5 text-xs rounded hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600 transition-colors flex items-center justify-between area-item-m' :
                        'w-full text-left px-3 py-2 text-xs rounded-lg hover:bg-wiener-cyan/20 hover:text-wiener-cyan font-medium text-gray-600 transition-colors flex items-center justify-between area-item';
                }
            });

            filtrarEventos(true);
        }

        function updateMobileDateText() {
            if(calendar) {
                const title = calendar.view.title;
                document.getElementById('calendarTitlePopup').innerText = title;
            }
        }

        function filterByImportance(imp) {
            currentImportanceFilter = imp;
            document.querySelectorAll('.imp-chip, .imp-chip-m').forEach(btn => {
                if (btn.getAttribute('data-imp') === imp) {
                    btn.className = btn.className.includes('imp-chip-m') ?
                        'imp-chip-m px-2 py-1 text-[11px] font-semibold rounded bg-wiener-cyan text-white shadow-sm transition-all' :
                        'imp-chip px-2.5 py-1 text-xs font-semibold rounded bg-wiener-cyan text-white shadow-sm transition-all';
                } else {
                    btn.className = btn.className.includes('imp-chip-m') ?
                        'imp-chip-m px-2 py-1 text-[11px] font-medium rounded text-gray-600 hover:text-wiener-cyan transition-all' :
                        'imp-chip px-2.5 py-1 text-xs font-medium rounded text-gray-600 hover:text-wiener-cyan transition-all';
                }
            });
            filtrarEventos(true);
        }

        function filtrarEventos(useLoader = true) {
            if (!calendar) return;

            const badge = document.getElementById('filterActiveBadge');
            if (currentLugarFilter !== '' || currentAreaFilter !== '' || currentImportanceFilter !== '') {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const applyFilter = () => {
                const eventosFiltrados = allEvents.filter(ev => {
                    const matchLugar = !currentLugarFilter || ev.lugar === currentLugarFilter;
                    const matchArea = !currentAreaFilter || ev.area === currentAreaFilter;
                    const matchImportance = !currentImportanceFilter || ev.importancia === currentImportanceFilter;
                    return matchLugar && matchArea && matchImportance;
                });

                calendar.removeAllEvents();
                calendar.addEventSource(eventosFiltrados);
                setTimeout(setupDayTooltips, 100);
            };

            if (useLoader) {
                runWithLoader(applyFilter, 'Aplicando filtros...');
            } else {
                applyFilter();
            }
        }

        function changeTimeSlot(slotDuration, btnElem) {
            const btn60 = document.getElementById('scaleBtn60');
            const btn30 = document.getElementById('scaleBtn30');

            btn60.className = "px-2.5 py-1 text-[10px] font-semibold rounded transition-all text-gray-600";
            btn30.className = "px-2.5 py-1 text-[10px] font-semibold rounded transition-all text-gray-600";
            btnElem.className = "px-2.5 py-1 text-[10px] font-semibold rounded transition-all bg-wiener-cyan text-white shadow-sm";

            runWithLoader(() => {
                calendar.setOption('slotDuration', slotDuration);
            }, 'Ajustando escala horaria...');
        }

        function setMiniClickMode(mode) {
            miniClickMode = mode;
            ['Day', 'Week', 'Month'].forEach(m => {
                document.getElementById('modeBtn' + m).className = "px-2 py-1 text-[10px] font-semibold rounded transition-all text-gray-600";
            });
            document.getElementById('modeBtn' + mode.charAt(0).toUpperCase() + mode.slice(1)).className = "px-2.5 py-1 text-[10px] font-semibold rounded transition-all bg-wiener-cyan text-white shadow-sm";

            const labels = { day: 'Cambiando a vista Día...', week: 'Cambiando a vista Semana...', month: 'Cambiando a vista Mes...' };
            runWithLoader(() => {
                const currentDate = calendar.getDate();
                if (mode === 'day') calendar.changeView('timeGridDay', currentDate);
                else if (mode === 'week') calendar.changeView('timeGridWeek', currentDate);
                else calendar.changeView('dayGridMonth', currentDate);
                renderMiniCalendar();
            }, labels[mode] || 'Cambiando vista...');
        }

        function changeMiniMonth(dir) {
            miniCalendarDate.setMonth(miniCalendarDate.getMonth() + dir);
            runWithLoader(() => {
                calendar.gotoDate(miniCalendarDate);
                renderMiniCalendar();
            }, 'Cargando mes...');
        }

        function renderMiniCalendar() {
            const grid = document.getElementById('miniCalGrid');
            const title = document.getElementById('miniCalTitle');
            if(!grid || !title) return;
            grid.innerHTML = '';
            const y = miniCalendarDate.getFullYear();
            const m = miniCalendarDate.getMonth();
            const names = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"];
            title.innerText = `${names[m]} ${y}`;

            const firstDay = new Date(y, m, 1).getDay();
            const totalDays = new Date(y, m + 1, 0).getDate();
            const prevDays = new Date(y, m, 0).getDate();
            const todayStr = formatLocalDate(new Date());

            let activeDaysSet = new Set();
            try {
                const view = calendar.view;
                if (view && view.activeStart && view.activeEnd) {
                    let d = new Date(view.activeStart);
                    while (d < view.activeEnd) {
                        activeDaysSet.add(formatLocalDate(d));
                        d.setDate(d.getDate() + 1);
                    }
                }
            } catch (e) {}

            let arr = [];
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayNum = prevDays - i;
                const prevM = m === 0 ? 11 : m - 1;
                const prevY = m === 0 ? y - 1 : y;
                arr.push({ dayNum, curr: false, dateStr: `${prevY}-${String(prevM + 1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}` });
            }
            for (let i = 1; i <= totalDays; i++) {
                arr.push({ dayNum: i, curr: true, dateStr: `${y}-${String(m + 1).padStart(2,'0')}-${String(i).padStart(2,'0')}` });
            }
            let totalCells = Math.ceil(arr.length / 7) * 7;
            for (let i = 1; totalCells > arr.length; i++) {
                const nextM = m === 11 ? 0 : m + 1;
                const nextY = m === 11 ? y + 1 : y;
                arr.push({ dayNum: i, curr: false, dateStr: `${nextY}-${String(nextM + 1).padStart(2,'0')}-${String(i).padStart(2,'0')}` });
            }

            for (let w = 0; w < arr.length; w += 7) {
                const weekDays = arr.slice(w, w + 7);
                const isWeekSelected = weekDays.some(d => activeDaysSet.has(d.dateStr));

                const weekContainer = document.createElement('div');
                weekContainer.className = "col-span-7 grid grid-cols-7 py-0.5 rounded-full transition-all";

                if (miniClickMode === 'week' && isWeekSelected) {
                    weekContainer.classList.add('bg-[#6EE7F5]/55', 'border', 'border-[#2CC5DF]', 'shadow-2xs');
                }
                if (miniClickMode === 'week' || miniClickMode === 'month') {
                    weekContainer.classList.add('hover:bg-cyan-100/60', 'cursor-pointer');
                }

                weekDays.forEach(d => {
                    const cell = document.createElement('div');
                    const isToday = d.dateStr === todayStr;
                    const isSelected = activeDaysSet.has(d.dateStr);

                    let baseClasses = "py-1 text-center rounded-full text-xs transition-all font-medium ";
                    if (!d.curr) {
                        baseClasses += "text-slate-400 ";
                    } else if (isToday) {
                        baseClasses += "font-bold text-white bg-[#00A3AD] shadow-sm ";
                    } else if (miniClickMode === 'day' && isSelected) {
                        baseClasses += "bg-[#6EE7F5]/60 border border-[#2CC5DF] text-[#083344] shadow-sm font-bold ";
                    } else if (miniClickMode === 'week' && isWeekSelected) {
                        baseClasses += "text-[#083344] font-bold ";
                    } else {
                        baseClasses += "text-slate-700 ";
                    }
                    if (miniClickMode === 'day') {
                        baseClasses += "cursor-pointer hover:bg-gray-200 ";
                    }

                    cell.className = baseClasses;
                    cell.innerText = d.dayNum;

                    cell.onclick = (e) => {
                        e.stopPropagation();
                        miniCalendarDate = new Date(d.dateStr + 'T00:00:00');
                        const msg = miniClickMode === 'day' ? 'Cargando día...' : (miniClickMode === 'week' ? 'Cargando semana...' : 'Cargando mes...');
                        runWithLoader(() => {
                            if (miniClickMode === 'day') calendar.changeView('timeGridDay', d.dateStr);
                            else if (miniClickMode === 'week') calendar.changeView('timeGridWeek', d.dateStr);
                            else calendar.changeView('dayGridMonth', d.dateStr);
                            renderMiniCalendar();
                        }, msg);
                    };
                    weekContainer.appendChild(cell);
                });

                if (miniClickMode === 'week') {
                    weekContainer.onclick = () => {
                        miniCalendarDate = new Date(weekDays[0].dateStr + 'T00:00:00');
                        runWithLoader(() => {
                            calendar.changeView('timeGridWeek', weekDays[0].dateStr);
                            renderMiniCalendar();
                        }, 'Cargando semana...');
                    };
                } else if (miniClickMode === 'month') {
                    weekContainer.onclick = () => {
                        miniCalendarDate = new Date(weekDays[3].dateStr + 'T00:00:00');
                        runWithLoader(() => {
                            calendar.changeView('dayGridMonth', weekDays[3].dateStr);
                            renderMiniCalendar();
                        }, 'Cargando mes...');
                    };
                }

                grid.appendChild(weekContainer);
            }
        }

        function setupDayTooltips() {
            const tooltip = document.getElementById('customTooltip');
            const tDate = document.getElementById('tooltipDate');
            const tContent = document.getElementById('tooltipContent');

            document.querySelectorAll('.fc-daygrid-day, .fc-timegrid-slot, .fc-timegrid-col').forEach(el => {
                let dStr = el.getAttribute('data-date') || (el.closest('.fc-timegrid-col') ? el.closest('.fc-timegrid-col').getAttribute('data-date') : null);
                if (!dStr) return;

                el.onmouseenter = (e) => {
                    const evs = getEventsForDateStr(dStr);
                    if (evs.length > 0) {
                        tDate.innerText = `📅 ${dStr}`;
                        tContent.innerHTML = evs.map(ev => `<div class="truncate">• <span class="font-semibold">${ev.title}</span></div>`).join('');
                        tooltip.style.left = `${e.clientX + 12}px`;
                        tooltip.style.top = `${e.clientY + 12}px`;
                        tooltip.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                        tooltip.classList.add('opacity-100', 'scale-100');
                    }
                };
                el.onmousemove = (e) => {
                    tooltip.style.left = `${e.clientX + 12}px`;
                    tooltip.style.top = `${e.clientY + 12}px`;
                };
                el.onmouseleave = () => {
                    tooltip.classList.remove('opacity-100', 'scale-100');
                    tooltip.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                };
            });
            renderMiniCalendar();
        }

        function mostrarDetalleEvento(evObj) {
            const ev = evObj.extendedProps;
            document.getElementById('modalTitle').innerText = evObj.title;
            document.getElementById('modalArea').innerText = `ÁREA: ${ev.area}`;
            document.getElementById('modalLugar').innerText = ev.lugar;
            document.getElementById('modalModalidad').innerText = ev.modalidad;
            document.getElementById('modalPublico').innerText = ev.publico;
            document.getElementById('modalComentario').innerText = ev.comentario || 'Sin comentarios.';

            const opt = { hour: '2-digit', minute: '2-digit' };
            const startTxt = evObj.start ? evObj.start.toLocaleTimeString([], opt) : '--';
            const endTxt = evObj.end ? evObj.end.toLocaleTimeString([], opt) : '--';
            document.getElementById('modalHorario').innerText = `${startTxt} - ${endTxt}`;

            const badge = document.getElementById('modalImportanceBadge');
            badge.className = 'px-2.5 py-0.5 text-xs font-bold rounded-full bg-cyan-100 text-cyan-800 border border-cyan-200';
            badge.innerText = ev.importancia;

            const modal = document.getElementById('eventModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('hidden');
            setTimeout(() => { container.classList.remove('scale-95', 'opacity-0'); container.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => document.getElementById('eventModal').classList.add('hidden'), 150);
        }

        function mostrarSelectorEventos(dateStr, eventos) {
            document.getElementById('multiModalTitle').innerText = `📅 Eventos del ${dateStr}`;
            const list = document.getElementById('multiModalList');
            list.innerHTML = '';
            eventos.forEach(ev => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-wiener-lightBg hover:bg-cyan-50 border border-wiener-border p-3 rounded-lg flex items-center justify-between';
                const timeStr = ev.start ? ev.start.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                btn.innerHTML = `<div><span class="text-xs font-bold text-wiener-cyan block">${timeStr} - ${ev.title}</span><span class="text-[11px] text-gray-500">${ev.extendedProps.lugar || 'Sin sede'}</span></div><span>➡️</span>`;
                btn.onclick = () => { closeMultiModal(); mostrarDetalleEvento(ev); };
                list.appendChild(btn);
            });
            document.getElementById('multiModal').classList.remove('hidden');
        }

        function closeMultiModal() { document.getElementById('multiModal').classList.add('hidden'); }
        function closeEmptyModal() { document.getElementById('emptyModal').classList.add('hidden'); }
    </script>
</body>
</html>

        function initHeaderLogo() {
            const imgEl = document.getElementById('headerLogoImg');
            const fallbackEl = document.getElementById('logoFallback');
            if (!imgEl || !fallbackEl) return;

            const rawConst = String(typeof LOGO_BASE64 !== 'undefined' ? LOGO_BASE64 : '').trim();
            const currentSrc = String(imgEl.getAttribute('src') || '').trim();

            let finalSrc = currentSrc;
            if (!finalSrc && rawConst) {
                finalSrc = rawConst.startsWith('data:') ? rawConst : `data:image/png;base64,${rawConst}`;
            }

            if (!finalSrc) {
                imgEl.classList.add('hidden');
                fallbackEl.classList.remove('hidden');
                return;
            }

            const showImage = () => {
                imgEl.classList.remove('hidden');
                fallbackEl.classList.add('hidden');
            };

            const showFallback = () => {
                imgEl.classList.add('hidden');
                fallbackEl.classList.remove('hidden');
            };

            imgEl.onload = showImage;
            imgEl.onerror = showFallback;

            if (imgEl.src !== finalSrc) {
                imgEl.src = finalSrc;
            }

            if (imgEl.complete && imgEl.naturalWidth > 0) {
                showImage();
            }
        }

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function normalizeSearchText(str) {
            return String(str ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim();
        }

        function toDateKey(d) {
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function parseDateKey(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, (m || 1) - 1, d || 1);
        }

        function startOfDay(d) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }

        function addDays(d, days) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate() + days);
        }

        function addMonthsClamped(d, deltaMonths) {
            const targetYear = d.getFullYear();
            const targetMonth = d.getMonth() + deltaMonths;
            const firstOfTarget = new Date(targetYear, targetMonth, 1);
            const daysInTarget = new Date(firstOfTarget.getFullYear(), firstOfTarget.getMonth() + 1, 0).getDate();
            return new Date(firstOfTarget.getFullYear(), firstOfTarget.getMonth(), Math.min(d.getDate(), daysInTarget));
        }

        function startOfSundayWeek(d) {
            const base = startOfDay(d);
            return addDays(base, -base.getDay());
        }

        function startOfMonthGridSunday(d) {
            const firstOfMonth = new Date(d.getFullYear(), d.getMonth(), 1);
            return startOfSundayWeek(firstOfMonth);
        }

        function playSlideFeedback(el, direction) {
            if (!el) return;
            el.classList.remove('anim-slide-left', 'anim-slide-right');
            void el.offsetWidth;
            el.classList.add(direction === 'left' ? 'anim-slide-left' : 'anim-slide-right');
        }

        function buildAreaColorMap(events) {
            areaColorMap.clear();
            const areas = [...new Set(events.map(ev => String(ev.area ?? 'SIN ÁREA').trim() || 'SIN ÁREA'))]
                .sort((a, b) => a.localeCompare(b, 'es'));
            areas.forEach((area, i) => {
                const hue = (AREA_HUE_BASES[i % AREA_HUE_BASES.length] + Math.floor(i / AREA_HUE_BASES.length) * 19) % 360;
                areaColorMap.set(area, hue);
            });
        }

        function getAreaPalette(area) {
            const clean = String(area ?? 'SIN ÁREA').trim() || 'SIN ÁREA';
            const hue = areaColorMap.has(clean) ? areaColorMap.get(clean) : 188;
            return {
                hue,
                barColor: `hsl(${hue}, 70%, 46%)`,
                selectedDotColor: `hsl(${hue}, 82%, 82%)`,
                cardBg: `hsla(${hue}, 72%, 78%, 0.34)`,
                cardBorder: `hsla(${hue}, 70%, 48%, 0.55)`
            };
        }

        function normalizeEvents(data) {
            const list = Array.isArray(data) ? data : (Array.isArray(data?.eventos) ? data.eventos : []);
            buildAreaColorMap(list);
            return list.map((ev, idx) => {
                const startDate = ev.start ? new Date(ev.start) : null;
                const endDate = ev.end ? new Date(ev.end) : null;
                const area = String(ev.area ?? 'SIN ÁREA').trim() || 'SIN ÁREA';
                const lugar = String(ev.lugar ?? 'No especificado').trim() || 'No especificado';
                const importancia = String(ev.importancia ?? 'MEDIA').trim() || 'MEDIA';
                const palette = getAreaPalette(area);
                return {
                    id: String(ev.id ?? idx + 1),
                    title: String(ev.title ?? 'Evento sin título').trim(),
                    area,
                    startDate,
                    endDate,
                    dateKey: startDate && !isNaN(startDate) ? toDateKey(startDate) : '',
                    lugar,
                    modalidad: String(ev.modalidad ?? 'PRESENCIAL').trim(),
                    publico: String(ev.publico ?? 'GENERAL').trim(),
                    comentario: String(ev.comentario ?? '').trim(),
                    importancia,
                    palette
                };
            }).filter(ev => ev.startDate && !isNaN(ev.startDate));
        }

        function matchesActiveFilters(ev) {
            if (filters.lugar !== 'ALL' && ev.lugar !== filters.lugar) return false;
            if (filters.area !== 'ALL' && ev.area !== filters.area) return false;
            if (filters.importancia !== 'ALL') {
                const evImp = normalizeSearchText(ev.importancia).replace(/\s+/g, ' ');
                const targetImp = normalizeSearchText(filters.importancia).replace(/\s+/g, ' ');
                if (evImp !== targetImp) return false;
            }
            return true;
        }

        function getFilteredEvents() {
            return allEvents.filter(matchesActiveFilters);
        }

        // Devuelve un Map: dateKey -> { count, barColor, selectedDotColor } del área con más eventos ese día
        function getDominantAreaByDateMap() {
            const perDayArea = new Map();

            getFilteredEvents().forEach(ev => {
                if (!ev.dateKey) return;
                if (!perDayArea.has(ev.dateKey)) {
                    perDayArea.set(ev.dateKey, new Map());
                }
                const areaCounts = perDayArea.get(ev.dateKey);
                const prev = areaCounts.get(ev.area);
                if (prev) {
                    prev.count += 1;
                } else {
                    areaCounts.set(ev.area, {
                        count: 1,
                        palette: ev.palette
                    });
                }
            });

            const dominantMap = new Map();
            perDayArea.forEach((areaCounts, key) => {
                let winner = null;
                areaCounts.forEach(entry => {
                    if (!winner || entry.count > winner.count) {
                        winner = entry;
                    }
                });
                if (winner) {
                    dominantMap.set(key, winner.palette);
                }
            });

            return dominantMap;
        }

        function resetAllFilters() {
            filters = { lugar: 'ALL', area: 'ALL', importancia: 'ALL' };
            updateFilterChipsUI();
            renderCalendarGrid();
            renderCurrentView(true);
            closeFilterModal();
        }

        function formatAmPm(dateObj) {
            let hours = dateObj.getHours();
            const mins = pad2(dateObj.getMinutes());
            const period = hours >= 12 ? 'p. m.' : 'a. m.';
            hours = hours % 12;
            if (hours === 0) hours = 12;
            return `${hours}:${mins} ${period}`;
        }

        function formatMinsToAmPm(totalMins) {
            const clamped = Math.max(0, Math.min(24 * 60, totalMins));
            const h24 = Math.floor(clamped / 60) % 24;
            const mins = pad2(clamped % 60);
            const period = Math.floor(clamped / 60) >= 12 && clamped < 24 * 60 ? 'p. m.' : 'a. m.';
            let h12 = h24 % 12;
            if (h12 === 0) h12 = 12;
            return `${h12}:${mins} ${period}`;
        }

        function formatHourAxisLabel(hour24) {
            if (hour24 === 0) return '0';
            if (hour24 < 12) return `${hour24} a. m.`;
            if (hour24 === 12) return '12 p. m.';
            return `${hour24 - 12} p. m.`;
        }

        function formatDurationLabel(startD, endD) {
            if (!startD || !endD || isNaN(endD)) return '';
            const diffMin = Math.max(15, Math.round((endD - startD) / 60000));
            if (diffMin < 60) return `${diffMin} min`;
            const h = Math.floor(diffMin / 60);
            const m = diffMin % 60;
            return m ? `${h} h ${m} min` : `${h} h`;
        }

        function formatDayHeadingParts(d) {
            const monthsShort = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sep.', 'oct.', 'nov.', 'dic.'];
            const weekNames = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
            return {
                left: `${d.getDate()} ${monthsShort[d.getMonth()]}`,
                right: weekNames[d.getDay()]
            };
        }

        function updateFloatingTodayArrow() {
            const todayStart = startOfDay(new Date());
            const selStart = startOfDay(selectedDate);
            const arrowEl = document.getElementById('floatingTodayArrow');
            if (!arrowEl) return;
            arrowEl.innerText = selStart > todayStart ? '↑' : '↓';
        }

        function renderHeaderMonth() {
            const monthsLong = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            const contextDate = calendarMode === 'week' ? weekAnchorDate : selectedDate;
            document.getElementById('monthHeading').innerText = `${monthsLong[contextDate.getMonth()]} ${contextDate.getFullYear()}`;
            updateFloatingTodayArrow();
            updateWeekRangeBadge();
        }

        function updateWeekRangeBadge() {
            const badge = document.getElementById('weekRangeBadge');
            if (!badge) return;

            if (calendarMode !== 'week') {
                badge.classList.add('hidden');
                return;
            }

            const shownSunday = startOfSundayWeek(weekAnchorDate);
            const shownSaturday = addDays(shownSunday, 6);
            const selectedSunday = startOfSundayWeek(selectedDate);

            if (toDateKey(shownSunday) === toDateKey(selectedSunday)) {
                badge.classList.add('hidden');
                return;
            }

            const pStart = formatDayHeadingParts(shownSunday);
            const pEnd = formatDayHeadingParts(shownSaturday);
            badge.innerText = `Semana ${pStart.left} – ${pEnd.left}`;
            badge.classList.remove('hidden');
        }

        function renderCalendarGrid() {
            const pill = document.getElementById('handlePill');
            const grid = document.getElementById('calendarDaysGrid');

            pill.className = calendarMode === 'month'
                ? 'w-14 h-1.5 rounded-full bg-wiener-cyan transition-all'
                : 'w-12 h-1.5 rounded-full bg-slate-300 transition-all';

            grid.innerHTML = '';
            const selectedKey = toDateKey(selectedDate);
            const todayKey = toDateKey(new Date());
            const dominantAreaByDate = getDominantAreaByDateMap();
            const monthsShort = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sep.', 'oct.', 'nov.', 'dic.'];

            const isMonth = calendarMode === 'month';
            const startCursor = isMonth ? startOfMonthGridSunday(selectedDate) : startOfSundayWeek(weekAnchorDate);
            const totalCells = isMonth ? 35 : 7;

            for (let i = 0; i < totalCells; i++) {
                const dayObj = addDays(startCursor, i);
                const key = toDateKey(dayObj);
                const isSelected = key === selectedKey;
                const isToday = key === todayKey;
                const domPalette = dominantAreaByDate.get(key) || null;
                const isOutsideMonth = isMonth && dayObj.getMonth() !== selectedDate.getMonth();
                const prevDay = i > 0 ? addDays(startCursor, i - 1) : null;
                const showsMonthChange = i > 0 && prevDay && prevDay.getMonth() !== dayObj.getMonth();

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'flex flex-col items-center py-0.5 active:scale-95 transition';
                btn.onclick = () => {
                    if (suppressNextClick) {
                        suppressNextClick = false;
                        return;
                    }
                    selectDate(dayObj, true);
                };

                let circleClass = '';
                if (isSelected) {
                    circleClass = 'w-8 h-8 rounded-full bg-wiener-cyan text-white font-extrabold text-xs flex items-center justify-center shadow-xs';
                } else if (isToday) {
                    circleClass = 'w-8 h-8 rounded-full border-2 border-wiener-cyan text-wiener-darkCyan font-bold text-xs flex items-center justify-center';
                } else if (isOutsideMonth) {
                    circleClass = 'w-8 h-8 rounded-full text-slate-400 font-medium text-xs flex items-center justify-center hover:bg-cyan-50/50';
                } else {
                    circleClass = 'w-8 h-8 rounded-full text-slate-800 font-semibold text-xs flex items-center justify-center hover:bg-cyan-50';
                }

                const monthHint = showsMonthChange
                    ? `<span class="text-[9px] font-bold text-slate-500 leading-none mt-0.5">${monthsShort[dayObj.getMonth()]}</span>`
                    : '';

                let eventDot = `<span class="w-1.5 h-1.5 mt-0.5 shrink-0" aria-hidden="true"></span>`;
                if (domPalette) {
                    const dotColor = isSelected ? domPalette.selectedDotColor : domPalette.barColor;
                    const dotOpacity = isOutsideMonth && !isSelected ? 'opacity: 0.45;' : '';
                    eventDot = `<span class="w-1.5 h-1.5 rounded-full mt-0.5 shrink-0" style="background-color: ${dotColor}; ${dotOpacity}" aria-hidden="true"></span>`;
                }

                btn.innerHTML = `<span class="${circleClass}">${dayObj.getDate()}</span>${monthHint}${eventDot}`;
                grid.appendChild(btn);
            }
        }

        function setCalendarMode(mode) {
            calendarMode = mode === 'month' ? 'month' : 'week';
            if (calendarMode === 'week') {
                weekAnchorDate = new Date(selectedDate);
            }
            renderHeaderMonth();
            renderCalendarGrid();
        }

        function toggleCalendarWeekMonth() {
            setCalendarMode(calendarMode === 'month' ? 'week' : 'month');
        }

        function initLiveCalendarDrag() {
            const area = document.getElementById('calendarCollapsibleArea');
            if (!area) return;

            let startX = null;
            let startY = null;
            let lastStepX = null;
            let movedHorizontally = false;

            area.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                lastStepX = startX;
                movedHorizontally = false;
            }, { passive: true });

            area.addEventListener('touchmove', (e) => {
                if (startX === null || startY === null || e.touches.length !== 1) return;
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                const totalDx = x - startX;
                const totalDy = y - startY;

                if (!movedHorizontally && Math.abs(totalDy) > Math.abs(totalDx) * 1.3 && Math.abs(totalDy) > 10) {
                    return;
                }

                if (calendarMode === 'week') {
                    const deltaFromLast = x - lastStepX;
                    if (Math.abs(deltaFromLast) >= WEEK_SWIPE_STEP_PX) {
                        const steps = Math.trunc(deltaFromLast / WEEK_SWIPE_STEP_PX);
                        if (steps !== 0) {
                            movedHorizontally = true;
                            suppressNextClick = true;
                            lastStepX += steps * WEEK_SWIPE_STEP_PX;

                            const weekDeltaDays = (-steps) * 7;
                            weekAnchorDate = addDays(weekAnchorDate, weekDeltaDays);
                            renderHeaderMonth();
                            renderCalendarGrid();
                            playSlideFeedback(document.getElementById('calendarDaysGrid'), weekDeltaDays > 0 ? 'left' : 'right');
                        }
                    }
                }
            }, { passive: true });

            area.addEventListener('touchend', (e) => {
                if (startX === null || startY === null) return;

                if (calendarMode === 'month' && e.changedTouches.length === 1) {
                    const dx = e.changedTouches[0].clientX - startX;
                    const dy = e.changedTouches[0].clientY - startY;
                    if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.45) {
                        suppressNextClick = true;
                        const monthDir = dx < 0 ? 1 : -1;
                        selectDate(addMonthsClamped(selectedDate, monthDir), true);
                        playSlideFeedback(document.getElementById('calendarDaysGrid'), monthDir > 0 ? 'left' : 'right');
                    }
                }

                startX = null;
                startY = null;
                lastStepX = null;

                if (movedHorizontally) {
                    setTimeout(() => { suppressNextClick = false; }, 60);
                }
            }, { passive: true });
        }

        function attachHorizontalSwipe(element, onSwipeLeft, onSwipeRight) {
            if (!element) return;
            let startX = null;
            let startY = null;

            element.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            element.addEventListener('touchend', (e) => {
                if (startX === null || startY === null || e.changedTouches.length !== 1) return;
                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                startX = null;
                startY = null;

                if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.45) {
                    if (dx < 0) onSwipeLeft();
                    else onSwipeRight();
                }
            }, { passive: true });
        }

        function initCalendarHandleGestures() {
            const handle = document.getElementById('calendarHandleBar');
            if (!handle) return;

            const onStart = (y) => {
                handleDragStartY = y;
            };

            const onEnd = (y) => {
                if (handleDragStartY === null) return;
                const deltaY = y - handleDragStartY;
                handleDragStartY = null;

                if (deltaY > 18) {
                    setCalendarMode('month');
                } else if (deltaY < -18) {
                    setCalendarMode('week');
                }
            };

            handle.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onStart(e.touches[0].clientY);
            }, { passive: true });

            handle.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) onEnd(e.changedTouches[0].clientY);
            }, { passive: true });

            handle.addEventListener('mousedown', (e) => onStart(e.clientY));
            window.addEventListener('mouseup', (e) => {
                if (handleDragStartY !== null) onEnd(e.clientY);
            });
        }

        function buildOverlapClusters(dayEvents) {
            const sorted = [...dayEvents].sort((a, b) => a.startDate - b.startDate);
            const clusters = [];

            sorted.forEach(ev => {
                const startMins = ev.startDate.getHours() * 60 + ev.startDate.getMinutes();
                let endMins = ev.endDate && !isNaN(ev.endDate)
                    ? (ev.endDate.getHours() * 60 + ev.endDate.getMinutes())
                    : (startMins + 30);
                if (endMins <= startMins) endMins = startMins + 30;

                const last = clusters[clusters.length - 1];
                if (last && startMins < last.endMins) {
                    last.events.push(ev);
                    last.endMins = Math.max(last.endMins, endMins);
                } else {
                    clusters.push({
                        startMins,
                        endMins,
                        events: [ev]
                    });
                }
            });

            return clusters;
        }
